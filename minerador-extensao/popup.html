<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #0f1115;
      --surface-color: #1a1d24;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #2e3340;
      --danger: #ef4444;
      --success: #10b981;
      --success-hover: #059669;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 340px;
      padding: 24px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .input-group { margin-bottom: 16px; }
    
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      transition: border 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    button:hover { background-color: var(--accent-hover); }
    
    #copyBtn {
      background-color: var(--success);
      margin-top: 12px;
      display: none;
    }
    #copyBtn:hover { background-color: var(--success-hover); }

    #openAppBtn {
      background-color: var(--surface-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: 500;
      font-size: 13px;
    }
    #openAppBtn:hover {
      background-color: var(--border);
    }

    #status, #loginStatus {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    #loginStatus.error {
      color: var(--danger);
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 16px;
      padding: 10px;
      background-color: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      resize: none;
      display: none;
    }

    .profile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--surface-color);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      font-size: 11px;
    }
    .profile-bar span {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }
    .profile-bar button {
      width: auto;
      margin: 0;
      padding: 4px 8px;
      background-color: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 10px;
      font-weight: 500;
      border-radius: 4px;
    }
    .profile-bar button:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h2>Minerador KGR</h2>
  
  <!-- Container de Autenticação -->
  <div id="loginView">
    <div class="input-group">
      <label for="loginEmail">E-mail de Login</label>
      <input type="email" id="loginEmail" placeholder="seu-email@exemplo.com">
    </div>
    <div class="input-group">
      <label for="loginPassword">Senha</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button id="submitLoginBtn">Entrar na Extensão</button>
    <div id="loginStatus"></div>
  </div>

  <!-- Container de Mineração -->
  <div id="minerView" class="hidden">
    <!-- Profile Bar -->
    <div class="profile-bar">
      <span id="userEmailSpan">Carregando...</span>
      <button id="logoutBtn">Sair</button>
    </div>
    
    <button id="openAppBtn">Acessar Painel Web (Planilhas)</button>

    <div class="input-group" id="brandContainer" style="display: none;">
      <label for="brandSelect">Selecionar Marca / Cliente</label>
      <select id="brandSelect" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background-color: var(--surface-color); color: var(--text-main); font-size: 13px; font-weight: 550; cursor: pointer;"></select>
    </div>

    <div class="input-group">
      <label for="listSelect">Salvar na Lista / Projeto</label>
      <select id="listSelect" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background-color: var(--surface-color); color: var(--text-main); font-size: 13px; font-weight: 550; cursor: pointer;"></select>
    </div>

    <div class="input-group">
      <label for="keyword">Palavra-chave Semente</label>
      <input type="text" id="keyword" placeholder="Ex: harmonização">
    </div>
    
    <div class="input-group">
      <label>Localidades para Extração (Selecione pelo menos uma)</label>
      
      <!-- Container de Seleção Rápida -->
      <div class="location-presets" style="margin-top: 6px; margin-bottom: 10px;">
        <label style="display: inline-flex; align-items: center; margin-bottom: 8px; cursor: pointer; font-size: 13px; color: var(--text-main);">
          <input type="checkbox" id="loc-brasil" checked style="width: auto; margin-right: 8px;"> Brasil (Geral)
        </label>
        
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">Estados (UF):</div>
        <div class="states-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background-color: var(--surface-color); padding: 8px; border-radius: 6px; border: 1px solid var(--border); max-height: 80px; overflow-y: auto; margin-bottom: 10px;">
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="SP" style="width: auto; margin-right: 4px;">SP</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="RJ" style="width: auto; margin-right: 4px;">RJ</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="MG" style="width: auto; margin-right: 4px;">MG</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="PR" style="width: auto; margin-right: 4px;">PR</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="RS" style="width: auto; margin-right: 4px;">RS</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="SC" style="width: auto; margin-right: 4px;">SC</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="GO" style="width: auto; margin-right: 4px;">GO</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="DF" style="width: auto; margin-right: 4px;">DF</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="BA" style="width: auto; margin-right: 4px;">BA</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="PE" style="width: auto; margin-right: 4px;">PE</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="CE" style="width: auto; margin-right: 4px;">CE</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="MT" style="width: auto; margin-right: 4px;">MT</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="MS" style="width: auto; margin-right: 4px;">MS</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="ES" style="width: auto; margin-right: 4px;">ES</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="AL" style="width: auto; margin-right: 4px;">AL</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="AM" style="width: auto; margin-right: 4px;">AM</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="AP" style="width: auto; margin-right: 4px;">AP</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="MA" style="width: auto; margin-right: 4px;">MA</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="PA" style="width: auto; margin-right: 4px;">PA</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="PB" style="width: auto; margin-right: 4px;">PB</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="PI" style="width: auto; margin-right: 4px;">PI</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="RN" style="width: auto; margin-right: 4px;">RN</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="RO" style="width: auto; margin-right: 4px;">RO</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="RR" style="width: auto; margin-right: 4px;">RR</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="SE" style="width: auto; margin-right: 4px;">SE</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="TO" style="width: auto; margin-right: 4px;">TO</label>
          <label style="display: flex; align-items: center; font-size: 10px; cursor: pointer;"><input type="checkbox" class="loc-state" value="AC" style="width: auto; margin-right: 4px;">AC</label>
        </div>
      </div>
      
      <!-- Entrada Livre -->
      <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">Outras cidades/localidades (ex: Campinas, Niterói):</div>
      <input type="text" id="location" placeholder="Separadas por vírgula">
    </div>
    
    <button id="mineBtn">Iniciar Extração</button>
    <div id="status"></div>
    
    <textarea id="results" readonly></textarea>
    <button id="copyBtn">Copiar Dados Limpos</button>
  </div>

  <script src="config.local.js"></script>
  <script src="popup.js"></script>
</body>
</html>
